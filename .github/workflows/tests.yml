name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m unittest discover -s tests -v

      # The committed notebook is generated. Regenerating it must reproduce the
      # same code and prose, or the two have drifted apart. Only sources are
      # compared - outputs legitimately differ between executions.
      - name: Notebook matches its generator
        run: |
          python - <<'EOF'
          import json, subprocess, sys
          from pathlib import Path

          nb = Path("notebooks/aircraft_detection.ipynb")
          committed = [c["source"] for c in json.loads(nb.read_text(encoding="utf-8"))["cells"]]
          before = nb.read_bytes()
          subprocess.run([sys.executable, "notebooks/build_notebook.py"], check=True)
          regenerated = [c["source"] for c in json.loads(nb.read_text(encoding="utf-8"))["cells"]]
          nb.write_bytes(before)  # restore the executed version with its outputs

          if committed != regenerated:
              print("notebooks/aircraft_detection.ipynb is out of sync with build_notebook.py")
              print("run: python notebooks/build_notebook.py, re-execute, and commit")
              sys.exit(1)
          print(f"notebook in sync ({len(committed)} cells)")
          EOF
